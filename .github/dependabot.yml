# Description: Weekly version updates for the uv lockfile, the GitHub Actions
#              and the Dockerfile base image, grouped, all aimed at develop.
#
# Grouped on purpose: ungrouped, this opens several PRs a week and they stop
# getting read. Security updates are separate: they come from the repository's
# Dependabot security updates setting, one PR per advisory, outside this cadence,
# and always against the default branch, which is develop for that reason.
#
# Python is split in two groups so a tooling bump never blocks a runtime one.
# Python majors are not ignored: they land on develop, where CI and the next
# release catch a break. Majors stay ignored for actions and the base image.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      # First matching group wins, so the dev tools are listed before the rest.
      python-dev:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "coverage"
          - "types-*"
          - "pre-commit"
      python-runtime:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
