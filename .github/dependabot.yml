# Description: Weekly version updates for the uv lockfile, the GitHub Actions
#              and the Dockerfile base image, one grouped PR per ecosystem.
#
# Grouped on purpose: ungrouped, this opens several PRs a week and they stop
# getting read. Security updates are separate: they come from the repository's
# Dependabot security updates setting, one PR per advisory, outside this cadence.
#
# Majors are ignored. A major bump is a behaviour change and should arrive as
# its own PR that someone chose to open and tested, not as one line inside a
# bump of five other things.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
